apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: llamastack
  namespace: openshift-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: llamastack-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: llamastack-{{name}}
      labels:
        velero.io/exclude-from-backup: "true"
    spec:
      project: default
      sources:
        - repositoryType: git
          repoURL: https://github.com/rhpds/llama-stack-on-ocp.git
          targetRevision: main
          path: kubernetes/kustomize/overlay/all-models
      destination:
        namespace: default
        server: "{{server}}"
      syncPolicy:
        automated:
          selfHeal: true
          prune: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
---
apiVersion: cluster.open-cluster-management.io/v1beta1
kind: Placement
metadata:
  name: llamastack-placement
  namespace: openshift-gitops
spec:
  numberOfClusters: 1
  clusterSets:
    - default
  predicates:
    - requiredClusterSelector:
        labelSelector:
          matchExpressions:
            - key: gpu-enabled
              operator: In
              values:
                - "true"
